{% extends "base.html" %}
{% block body %}
<style>
  /* A playmat, not a list (user, 2026-11-21: "it needs to feel like a regular game").
     The AI's side is mirrored above yours; every legal move lives ON the card or zone
     it uses -- glowing ones can act, a tap opens the card with its moves -- and only
     the moves with no card (phases, pass, done) are buttons. */
  .mat{--w:min(calc((100vw - 46px) / 7), 74px);--h:calc(var(--w) * 1.46);max-width:calc(var(--w) * 7 + 24px);
       margin:0 auto;user-select:none;-webkit-user-select:none}
  .hud{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 4px;border-bottom:1px solid var(--line)}
  .hud .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .phases{display:flex;gap:3px;align-items:center}
  .phases b{font-size:10.5px;font-weight:700;padding:2px 5px;border-radius:4px;color:var(--faint);border:1px solid var(--line)}
  .phases b.on{color:#111;background:#7aa2f7;border-color:#7aa2f7}
  .lps{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  .lps small{font-weight:400;color:var(--dim);font-size:11px}
  .lps .low{color:#f7768e}
  .modes .undo{min-height:28px;padding:3px 12px;font-size:12.5px;font-weight:600;border-radius:999px;white-space:nowrap}
  .modes{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;margin-top:5px;
         font-size:11.5px;color:var(--dim)}
  .modes .resp{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
  .modes .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .modes .seg button{border:0;border-radius:0;background:transparent;color:var(--dim);font-size:12px;
                     padding:4px 9px;min-height:28px;font-weight:600}
  .modes .seg button.on{background:#7aa2f7;color:#111}
  .banner{margin:6px 0 0;padding:7px 10px;border-radius:8px;background:var(--panel);font-size:13.5px;line-height:1.35}
  .banner.you{border-left:4px solid #9ece6a}
  .banner.wait{border-left:4px solid #e0af68}
  .banner .last{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .side{display:grid;grid-template-columns:repeat(7, var(--w));gap:3px;justify-content:center;margin:4px 0}
  .cell{width:var(--w);height:var(--h);border-radius:5px;border:1px dashed #ffffff18;position:relative;
        display:flex;align-items:center;justify-content:center}
  .cell.pile{border-style:solid;border-color:#ffffff10;background:#ffffff05}
  .cell .tag{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:var(--faint);
             pointer-events:none;text-shadow:0 0 3px #000}
  .cell .cnt{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:var(--ink);
             background:#000a;border-radius:4px;padding:0 3px;z-index:3}
  .c{width:var(--w);height:var(--h);border-radius:5px;background:#2a2f45 center/cover no-repeat;position:absolute;
     inset:0;margin:auto;box-shadow:0 1px 3px #0008}
  .c.back{background:repeating-linear-gradient(45deg,#3b2f5a,#3b2f5a 6px,#2c2346 6px,#2c2346 12px)}
  .c.def{transform:rotate(90deg) scale(.68)}
  .c .mat-n{position:absolute;top:-4px;left:-4px;background:#7aa2f7;color:#111;font-size:10px;font-weight:700;
            border-radius:999px;padding:0 4px;line-height:14px}
  .glow{outline:3px solid #9ece6a;outline-offset:1px;animation:pulse 1.4s ease-in-out infinite;cursor:pointer;z-index:2}
  .pick{outline:3px solid #e0af68;outline-offset:1px;animation:pulse 1.1s ease-in-out infinite;cursor:pointer;z-index:2}
  .cell.zonepick{border:2px solid #e0af68;background:#e0af6822;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
  @keyframes pulse{50%{outline-color:transparent;border-color:transparent}}
  .mid{display:grid;grid-template-columns:repeat(7, var(--w));gap:3px;justify-content:center;margin:2px 0;
       border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;padding:3px 0}
  .aihand{display:flex;justify-content:center;gap:2px;min-height:calc(var(--h) * .38);margin:6px 0 2px}
  .aihand i{width:calc(var(--w) * .5);height:calc(var(--h) * .38);border-radius:3px;
            background:repeating-linear-gradient(45deg,#3b2f5a,#3b2f5a 4px,#2c2346 4px,#2c2346 8px)}
  .hand{display:flex;justify-content:center;padding:12px 4px 6px;overflow-x:auto;min-height:calc(var(--h) * 1.25)}
  .hand .h{flex:0 0 auto;width:calc(var(--w) * 1.22);height:calc(var(--h) * 1.22);margin-left:calc(var(--w) * -.18);
           border-radius:6px;background:#2a2f45 center/cover no-repeat;position:relative;box-shadow:0 2px 6px #000a;
           transition:transform .12s}
  .hand .h:first-child{margin-left:0}
  .hand .h.glow,.hand .h.pick{transform:translateY(-8px)}
  .bar{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
       padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .bar button{min-height:44px;padding:0 16px;font-size:14.5px;font-weight:600;border-radius:10px}
  .bar button.main{background:#7aa2f7;color:#111;border-color:#7aa2f7}
  .bar:empty{display:none}
  details.log{margin:8px 0}
  details.log summary{cursor:pointer;font-weight:600;font-size:13px}
  #log{font-size:12.5px;line-height:1.45;color:var(--dim);margin-top:4px}
  .sheet{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .in{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(560px,100%);
             max-height:88vh;overflow-y:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .sheet .head{display:flex;gap:12px;align-items:flex-start}
  .sheet .head .big{width:min(34vw,140px);aspect-ratio:1/1.46;border-radius:6px;flex:0 0 auto;background:#2a2f45 center/cover no-repeat}
  .sheet h4{margin:0 0 6px;font-size:16px}
  .sheet p{white-space:pre-line;font-size:13px;line-height:1.42;margin:0;color:var(--dim)}
  .sheet .moves{display:grid;gap:8px;margin-top:12px}
  .sheet .moves button{min-height:48px;font-size:15px;font-weight:600;border-radius:10px;text-align:left;padding:0 14px}
  .sheet .moves button.main{background:#9ece6a;color:#111;border-color:#9ece6a}
  .sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
  .sheet .grid div{aspect-ratio:1/1.46;border-radius:5px;background:#2a2f45 center/cover no-repeat;position:relative}
  .sheet .close{margin-top:10px;width:100%;min-height:44px}
  .sheet .grid div.on{outline:3px solid #9ece6a;outline-offset:1px}
  .sheet .grid div.off{opacity:.62}
  .sheet .grid div span{position:absolute;bottom:0;left:0;right:0;font-size:9.5px;line-height:1.15;
    background:#000b;color:#fff;padding:2px 3px;border-radius:0 0 5px 5px;max-height:2.4em;overflow:hidden}
  .sheet .note{font-size:12px;color:var(--faint);margin-top:6px}
  /* whose turn it is, at a glance: the HUD's edge and a chip take that side's colour */
  .hud.t-you{box-shadow:inset 0 3px 0 #9ece6a}
  .hud.t-ai{box-shadow:inset 0 3px 0 #f7768e}
  .turn{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
  .turn.you{background:#9ece6a;color:#111}
  .turn.ai{background:#f7768e;color:#111}
  .chainrow{display:flex;gap:4px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .chainrow .lk{width:30px;height:44px;border-radius:3px;background:#2a2f45 center/cover no-repeat;position:relative;cursor:pointer}
  .chainrow .lk b{position:absolute;top:-5px;left:-5px;font-size:9.5px;line-height:14px;padding:0 4px;border-radius:999px;color:#111}
  .chainrow .lk.you b{background:#9ece6a}
  .chainrow .lk.ai b{background:#f7768e}
  .chainrow .arrow{color:var(--faint);font-size:11px}
  .feed{margin:4px 0 0;font-size:12px;line-height:1.25;cursor:pointer}
  .feed div{display:flex;align-items:center;gap:6px;min-height:22px;color:var(--dim)}
  .feed i{width:15px;height:22px;border-radius:2px;background:#2a2f45 center/cover no-repeat;flex:0 0 auto}
  .feed i.none{background:transparent}
  .feed .you b{color:#9ece6a}
  .feed .ai b{color:#f7768e}
  .feed .new{color:var(--ink);animation:flash 1.6s ease-out}
  .feed .sep{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.03em}
  @keyframes flash{from{background:#7aa2f733}to{background:transparent}}
  .recent{box-shadow:0 0 0 3px #7aa2f7,0 0 14px #7aa2f7aa !important;z-index:2}
  #log .t{color:var(--ink);font-weight:700;margin-top:6px}
  #log .you{color:#9ece6a}
  #log .ai{color:#f7768e}
  .toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;padding:12px 22px;border-radius:12px;
         font-size:18px;font-weight:800;color:#111;pointer-events:none;opacity:0;transition:opacity .25s}
  .toast.on{opacity:.95}
  .back{font-size:12px;margin-right:6px}
  /* a phone shows the table only: the site header gives way (a back link sits in the HUD) */
  @media (max-width:760px){.page-head{display:none} body > header{display:none} main{padding-top:0}}
  @media (min-width:761px){.back{display:none}}
</style>

<div class="page-head">
  <h1>Duel #{{ state.id }}</h1>
  <div class="sub">{{ state.user_deck }} (you) vs {{ state.ai_deck }} (AI) ·
    <a href="{{ url_for('views.duel_list') }}">all duels</a></div>
</div>

<div class="mat">
  <div class="hud">
    <div class="top"><div class="phases"><a class="back" href="{{ url_for('views.duel_list') }}">← duels</a><span class="phases" id="phases"></span></div>
      <div class="lps" id="lps"></div></div>
    <div class="banner" id="banner"></div>
    <div class="modes" title="Auto: stops only when you have something to respond with. Manual: stops at every chance to respond. None: never stops to ask. Cards: stops only when one of the cards you pick can respond.">
      <button class="undo" id="undo" title="Take back your last move (the AI's moves after it go too)">↶ Undo</button>
      <button class="undo" id="flag" style="margin-right:auto;margin-left:-4px" title="Flag this position as unoptimal (your note becomes a test case)">⚑</button>
      <span class="resp">respond <span class="seg" id="modes"><button data-m="auto">Auto</button><button data-m="manual">Manual</button><button data-m="none">None</button><button data-m="select">Cards</button></span></span></div>
  </div>
  <div class="feed" id="feed" title="What just happened (tap for the whole log)"></div>
  <div class="aihand" id="aihand"></div>
  <div class="side" id="ai-st"></div>
  <div class="side" id="ai-m"></div>
  <div class="mid" id="emz"></div>
  <div class="side" id="you-m"></div>
  <div class="side" id="you-st"></div>
  <div class="hand" id="hand"></div>
  <div class="bar" id="bar"></div>
  <details class="log" id="logbox"><summary>What happened · <a href="{{ url_for('views.duel_list') }}">all duels</a></summary>
    <div id="log"></div></details>
  <details class="log" id="cmpbox" hidden><summary id="cmpsum">Your turn 1 vs the solver's</summary>
    <div id="cmp"></div></details>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script>
let S = {{ state|tojson }};
const base = `{{ url_for('views.index') }}img`;
const img = (c, size) => `${base}/${size || 'small'}/${c}.jpg`;
// Card art, fetched ONCE per page and kept as a blob. Every render rebuilds the mat, and a
// browser that does not trust the local CA keeps no HTTP cache, so plain url()s re-downloaded
// every picture on every move/poll and often lost the race (blank cards). Failures retry.
const ART = new Map(), WANT = [], BUSY = new Set();
let running = 0;
function bg(code, size) {          // the attributes that put a card's art on an element
  if (code === null || code === undefined || code === '') return '';
  const u = ART.get(img(code, size));
  return ` data-art="${code}"${size ? ` data-size="${size}"` : ''}${u ? ` style="background-image:url(${u})"` : ''}`;
}
function put(el, u) { el.style.backgroundImage = `url(${u})`; }
function paint(root) {
  (root || document).querySelectorAll('[data-art]').forEach(el => {
    const u = ART.get(img(el.dataset.art, el.dataset.size));
    if (u) put(el, u); else load(el.dataset.art, el.dataset.size, 0, true);
  });
}
function load(code, size, tries, urgent) {
  const u = img(code, size);
  if (ART.has(u) || BUSY.has(u)) return;
  BUSY.add(u);
  WANT[urgent ? 'unshift' : 'push']({u, code: String(code), size: size || '', tries: tries || 0});
  pump();
}
function pump() {
  while (running < 6 && WANT.length) {
    const j = WANT.shift(); running++;
    fetch(j.u, {credentials: 'same-origin'}).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(b => {
        ART.set(j.u, URL.createObjectURL(b));
        document.querySelectorAll(`[data-art="${j.code}"]`).forEach(el => {
          if ((el.dataset.size || '') === j.size) put(el, ART.get(j.u)); });
      })
      .catch(() => { if (j.tries < 5) setTimeout(() => { BUSY.delete(j.u); load(j.code, j.size, j.tries + 1, true); },
                                                  800 * 2 ** j.tries); else BUSY.delete(j.u); })
      .finally(() => { if (ART.has(j.u)) BUSY.delete(j.u); running--; pump(); });
  }
}
const name = c => (S.names[String(c)] || ('#' + c));
const text = c => (S.texts && S.texts[String(c)]) || '';
const esc = t => String(t).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const Z = {1: 'd', 2: 'h', 4: 'm', 8: 's', 16: 'g', 32: 'b', 64: 'x', 128: 'o'};
const key = (con, loc, seq) => `${con}-${Z[loc] || loc}-${seq}`;
const PILE = {g: 'GY', b: 'Banished', x: 'Extra Deck', d: 'Deck', o: 'Materials'};
let BY = {}, ZONE = {}, FREE = [], PILES = {}, MATS = {};

function index() {
  BY = {}; ZONE = {}; FREE = []; PILES = {}; MATS = {};
  for (const a of S.actions || []) {
    if (a.zone) { ZONE[key(a.zone.con, a.zone.loc, a.zone.seq)] = a; continue; }
    // an Xyz material (location MZONE|OVERLAY, sequence = its monster's zone): on the
    // monster that holds it -- the monster glows, a tap shows its materials to pick
    if (a.at && (a.at.loc & 0x80)) { const k = key(a.at.con, 4, a.at.seq); (MATS[k] = MATS[k] || []).push(a); continue; }
    // yes / no / an effect choice are questions, not card moves: buttons, with the card named
    if (a.at && !['position', 'yes', 'no', 'option'].includes(a.kind)) {
      const k = key(a.at.con, a.at.loc, a.at.seq), z = Z[a.at.loc];
      (BY[k] = BY[k] || []).push(a);
      if (PILE[z]) { const pk = `${a.at.con}-${z}`; (PILES[pk] = PILES[pk] || []).push(a); }
      continue;
    }
    FREE.push(a);
  }
}
const isPick = () => /SELECT_(CARD|UNSELECT_CARD|TRIBUTE|SUM)$/.test(S.prompt || '');
function cls(k) { return BY[k] || MATS[k] ? (isPick() || MATS[k] ? ' pick' : ' glow') : ''; }

function cardEl(code, pos, k, mats) {
  const back = code === null || code === undefined;
  // only a MONSTER lies sideways in Defense Position: a set Spell/Trap is face-down
  // (position 0xA) but stands upright (it was drawn sideways, 2026-11-21)
  const def = /-m-/.test(k) && pos && (pos & 0xC);
  const n = mats && mats.length ? `<b class="mat-n">${mats.length}</b>` : '';
  return `<div class="c${back ? ' back' : ''}${def ? ' def' : ''}${cls(k)}" data-k="${k}" data-code="${back ? '' : code}"${back ? '' : bg(code)}>${n}</div>`;
}
function zoneCell(p, loc, seq, list, label) {
  const k = key(p, loc, seq);
  const m = (list || []).find(x => x && x.sequence === seq);
  const zp = ZONE[k] ? ' zonepick' : '';
  return `<div class="cell${zp}" data-k="${k}" data-zone="${ZONE[k] ? 1 : ''}">${m ? cardEl(m.code, m.position, k, m.overlay) : ''}
    ${!m && label ? `<span class="tag">${label}</span>` : ''}</div>`;
}
function pileCell(p, z, cards, count) {
  const pk = `${p}-${z}`, top = cards && cards.length ? cards[cards.length - 1] : null;
  const n = count !== undefined ? count : (cards || []).length;
  const g = PILES[pk] ? (isPick() ? ' pick' : ' glow') : '';
  return `<div class="cell pile${g}" data-pile="${pk}">${top ? `<div class="c" data-code="${top}"${bg(top)}></div>`
    : (z === 'd' || z === 'x') && n ? '<div class="c back"></div>' : ''}<span class="cnt">${n}</span><span class="tag">${PILE[z]}</span></div>`;
}
function row(p, loc, mirror, left, right) {
  const P = S.board.players[p], list = loc === 4 ? P.mzone : P.szone;
  let seqs = [0, 1, 2, 3, 4]; if (mirror) seqs = seqs.reverse();
  return left + seqs.map(s => zoneCell(p, loc, s, list)).join('') + right;
}
function render() {
  index();
  const you = S.you, ai = S.ai, PY = S.board.players[you], PA = S.board.players[ai];
  const ph = {1: 'DP', 2: 'SP', 4: 'M1', 8: 'BP', 16: 'BP', 32: 'BP', 64: 'BP', 128: 'BP', 256: 'M2', 512: 'EP'}[S.phase];
  document.getElementById('phases').innerHTML = ['DP', 'SP', 'M1', 'BP', 'M2', 'EP'].map(x =>
    `<b class="${x === ph ? 'on' : ''}">${x}</b>`).join('') +
    `<span class="turn ${S.turn_player === you ? 'you' : 'ai'}">T${S.turn} · ${S.turn_player === you ? 'YOUR TURN' : "AI'S TURN"}</span>`;
  document.querySelector('.hud').className = 'hud ' + (S.turn_player === you ? 't-you' : 't-ai');
  const lp = (who, v) => `<span><small>${who}</small> <span class="${v <= 2000 ? 'low' : ''}">${v}</span></span>`;
  document.getElementById('lps').innerHTML = lp('AI', PA.lp) + lp('you', PY.lp);
  // the board: the AI mirrored on top, you below
  document.getElementById('aihand').innerHTML = '<i></i>'.repeat((PA.hand || []).length);
  document.getElementById('ai-st').innerHTML = row(ai, 8, true, pileCell(ai, 'd', null, PA.deck_count),
                                                    pileCell(ai, 'x', PA.extra_faceup, PA.extra_count));
  document.getElementById('ai-m').innerHTML = row(ai, 4, true, pileCell(ai, 'g', PA.grave), zoneCell(ai, 8, 5, PA.szone, 'field'));
  // extra monster zones (sequence 5 / 6), whoever holds them; banished piles at the ends
  const emz = s => { const own = [you, ai].find(p => (S.board.players[p].mzone || []).some(m => m && m.sequence === s));
    return own === undefined ? zoneCell(you, 4, s, [], 'EMZ') : zoneCell(own, 4, s, S.board.players[own].mzone); };
  document.getElementById('emz').innerHTML = pileCell(ai, 'b', PA.banished) + '<div></div>' + emz(5) + '<div></div>'
                                             + emz(6) + '<div></div>' + pileCell(you, 'b', PY.banished);
  document.getElementById('you-m').innerHTML = row(you, 4, false, zoneCell(you, 8, 5, PY.szone, 'field'), pileCell(you, 'g', PY.grave));
  document.getElementById('you-st').innerHTML = row(you, 8, false, pileCell(you, 'x', PY.extra_faceup, PY.extra_count),
                                                     pileCell(you, 'd', null, PY.deck_count));
  document.getElementById('hand').innerHTML = (PY.hand || []).map((c, i) => {
    const k = key(you, 2, i);
    return `<div class="h${cls(k)}" data-k="${k}" data-code="${c}"${bg(c)}></div>`; }).join('');
  banner();
  bar();
  const u = document.getElementById('undo');
  u.disabled = S.status === 'thinking' || !(S.can_undo);
  u.onclick = undo;
  document.getElementById('flag').onclick = flagIt;
  document.querySelectorAll('#modes button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === (S.respond || 'auto'));
    b.onclick = () => setMode(b.dataset.m); });
  logs();
  cmp();
  wire();
  paint();
}
// your turn-1 board against the solver's on the same hand, both through their kill check
function cmp() {
  const C = S.compare || {}, box = document.getElementById('cmpbox'), t = C.this;
  box.hidden = !t;
  if (!t) return;
  const k = C.survived || {};
  const side = (name, d) => `<div><b>${name}</b>: ${d.killed ? '<span class="low">killed on their turn 2</span>' : 'survived their turn 2'}`
    + `<br><small>monsters ${esc(d.monsters.join(', ') || 'none')} · backrow ${esc(d.backrow.join(', ') || 'none')}`
    + ` · counted pieces ${d.pieces.length}</small></div>`;
  document.getElementById('cmpsum').textContent = t.running ? "Your turn 1 vs the solver's (checking…)"
    : t.error ? "Your turn 1 vs the solver's (failed)"
    : `Your turn 1 vs the solver's: you ${t.you.killed ? 'died' : 'lived'}, solver ${t.solver ? (t.solver.killed ? 'died' : 'lived') : 'no line'}`;
  document.getElementById('cmp').innerHTML = t.running
    ? '<div>The solver is playing your opening hand, then both boards face the AI deck\'s full-strength kill search (takes ~20 min).</div>'
    : t.error ? `<div>${esc(t.error)}</div>`
    : side('You', t.you) + (t.solver ? side('Solver, same hand', t.solver) : '<div>Solver: found no line</div>')
      + (t.method && t.method !== k.method ? `<div><small>Judged under older settings (${esc(t.method)}): not in the tally.</small></div>` : '')
      + `<div><small>All duels under these settings (${esc(k.method || '')}): you survived ${k.you} of ${k.duels}, the solver ${k.solver} of ${k.duels}.`
      + ` The solver's search saw the AI's hand; the kill search sees both hands.</small></div>`;
}
const who = x => x.who === 'you' ? 'you' : x.who === 'AI' ? 'ai' : '';
// "you activates" but "your Havnis is discarded": a passive entry names the card's owner
const line = x => (x.who ? `<b>${esc(x.own ? (x.who === 'you' ? 'your' : "AI's") : x.who)}</b> ` : '') + esc(x.text);
let SEEN = null, TURN = null;     // the log entries and the turn the page last showed
function logs() {
  const L = S.log || [], first = (S.log_total || L.length) - L.length;   // global index of L[0]
  const fresh = i => SEEN !== null && first + i >= SEEN;
  // the whole log, newest turn first, a heading per turn
  let html = '', t = null;
  L.map((x, i) => [x, i]).reverse().forEach(([x, i]) => {
    if (x.text.startsWith('---')) return;
    if (x.turn !== t) { t = x.turn; html += `<div class="t">Turn ${t}</div>`; }
    html += `<div class="${who(x)}">${line(x)}</div>`; });
  document.getElementById('log').innerHTML = html;
  // the feed: the last few things that happened, new ones flashed, the turn they began marked
  const rows = [];
  const lim = Math.min(8, Math.max(4, L.filter((x, i) => fresh(i)).length));
  for (let i = L.length - 1; i >= 0 && rows.length < lim; i--) {
    const x = L[i];
    rows.push(x.text.startsWith('---')
      ? `<div class="sep${fresh(i) ? ' new' : ''}">── Turn ${x.turn}: ${x.who === 'you' ? 'your turn' : "the AI's turn"} ──</div>`
      : `<div class="${who(x)}${fresh(i) ? ' new' : ''}"><i class="${x.code ? '' : 'none'}"${bg(x.code)}></i>
         <span>${line(x)}</span></div>`);
  }
  const feed = document.getElementById('feed');
  feed.innerHTML = rows.join('');
  feed.onclick = () => { const d = document.getElementById('logbox'); d.open = true; d.scrollIntoView({behavior: 'smooth'}); };
  // ring the cards the newest entries name, so you see WHERE it happened
  const named = L.filter((x, i) => fresh(i) && x.code).map(x => String(x.code));
  const ring = new Set(named.length ? named.slice(-3) : []);
  document.querySelectorAll('.mat [data-code]').forEach(el => {
    if (ring.has(el.dataset.code) && !el.classList.contains('glow') && !el.classList.contains('pick')) el.classList.add('recent'); });
  if (TURN !== null && S.turn !== TURN) toast(S.turn_player === S.you ? `Turn ${S.turn} — your turn` : `Turn ${S.turn} — the AI's turn`,
                                               S.turn_player === S.you ? '#9ece6a' : '#f7768e');
  SEEN = S.log_total || L.length; TURN = S.turn;
}
function toast(msg, colour) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = colour; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800);
}
function banner() {
  const b = document.getElementById('banner');
  const top = S.chain.length ? S.chain[S.chain.length - 1] : null;
  // the chain as its cards, link 1 first: tap one to read it
  const lastTxt = S.chain.length ? `<div class="chainrow"><small>Chain:</small>${S.chain.map(([c, p], j) =>
    `${j ? '<span class="arrow">→</span>' : ''}<div class="lk ${p === S.you ? 'you' : 'ai'}" data-code="${c}" title="${esc(name(c))}"${bg(c)}
      onclick="openCard('${c}', null)"><b>${j + 1}</b></div>`).join('')}</div>` : '';
  if (S.status === 'thinking') { b.className = 'banner wait'; b.innerHTML = 'The AI is thinking…' + lastTxt; return; }
  if (S.status === 'over') { b.className = 'banner wait'; b.innerHTML = esc(S.note || 'The duel is over.'); return; }
  if (!(S.actions || []).length) { b.className = 'banner wait'; b.innerHTML = 'Waiting for the AI…' + lastTxt; return; }
  const glowing = Object.keys(BY).length || Object.keys(ZONE).length;
  const by = top ? `${top[1] === S.you ? 'your' : "the AI's"} <b>${esc(name(top[0]))}</b>` : '';
  let t;
  switch (S.prompt) {
    case 'MSG_SELECT_IDLECMD': t = 'Your Main Phase — tap a glowing card to use it' + (FREE.length ? ', or pick a phase below.' : '.'); break;
    case 'MSG_SELECT_BATTLECMD': t = 'Battle Phase — tap a glowing monster to attack, or move on below.'; break;
    case 'MSG_SELECT_CHAIN': t = top ? `${top[1] === S.you ? 'You' : 'The AI'} activated <b>${esc(name(top[0]))}</b>. `
        + (glowing ? 'Respond with a glowing card, or pass.' : 'Nothing to respond with — pass.')
        : (glowing ? 'You can respond now with a glowing card, or pass.' : 'Pass to go on.'); break;
    case 'MSG_SELECT_PLACE': t = 'Choose a zone — tap a highlighted zone.'; break;
    case 'MSG_SELECT_POSITION': t = 'Choose the position.'; break;
    case 'MSG_SELECT_EFFECTYN': case 'MSG_SELECT_YESNO': {
      const q = FREE.find(a => a.code);
      t = q ? `Use <b>${esc(name(q.code))}</b>'s effect?` : 'Use the effect?'; break; }
    case 'MSG_SELECT_OPTION': t = 'Choose an effect.'; break;
    default:
      // which chain link asks is not known here: name none rather than the wrong one
      t = Object.keys(MATS).length && !Object.keys(BY).length
          ? 'Choose a material — tap the highlighted Xyz monster, then the material.'
          : isPick() ? 'Choose a card — tap a highlighted card'
                       + (Object.keys(PILES).length ? ' or a highlighted pile' : '')
                       + (Object.keys(MATS).length ? ' (materials: tap their Xyz monster)' : '') + '.' : 'Your move.';
  }
  b.className = 'banner you'; b.innerHTML = t + lastTxt;
}
const FREE_ORDER = ['battle_phase', 'main2', 'end_phase', 'pass', 'finish', 'yes', 'no', 'cancel', 'option',
                    'position', 'number', 'declare', 'rps', 'shuffle'];
const SHORT = {battle_phase: 'Battle Phase', main2: 'Main Phase 2', end_phase: 'End turn', pass: 'Pass', finish: 'Done',
               yes: 'Yes', no: 'No', cancel: 'Cancel', shuffle: 'Shuffle hand'};
const POS = {1: 'Face-up Attack', 2: 'Face-down Attack', 4: 'Face-up Defense', 8: 'Set (face-down Defense)'};
function bar() {
  const acts = FREE.filter(a => a.kind !== 'shuffle')
                   .sort((a, b) => FREE_ORDER.indexOf(a.kind) - FREE_ORDER.indexOf(b.kind));
  const main = acts.length === 1 || ['yes', 'finish'].includes((acts[0] || {}).kind) ? 0 : -1;
  document.getElementById('bar').innerHTML = acts.map((a, j) =>
    `<button class="${j === main ? 'main' : ''}" onclick="act(${a.i})">${esc(a.kind === 'position' ? POS[a.pos] || a.label
      : SHORT[a.kind] || a.label)}</button>`).join('');
}
function verbs(acts) {      // the moves of one card, told apart when a card has several of a kind
  return acts.map((a, j) => {
    const many = acts.filter(x => x.verb === a.verb).length > 1;
    const n = acts.slice(0, j + 1).filter(x => x.verb === a.verb).length;
    return {a, label: a.kind === 'select' ? 'Choose this card' : a.kind === 'unselect' ? 'Unchoose' :
            a.kind === 'attack' ? 'Attack' : a.kind === 'chain' ? 'Activate (respond)' : a.verb + (many ? ` (effect ${n})` : '')};
  });
}
function openCard(code, k) {
  const acts = (k && BY[k]) || [];
  const mats = (k && MATS[k]) || [];
  if (!mats.length && acts.length === 1 && ['select', 'unselect'].includes(acts[0].kind)) return act(acts[0].i);
  const known = code !== '' && code !== undefined && code !== null;
  document.getElementById('sheet-in').innerHTML = `<div class="head">${known ? `<div class="big"${bg(code, 'full')}></div>` : ''}
    <div><h4>${known ? esc(name(code)) : 'Face-down card'}</h4><p>${known ? esc(text(code)) : ''}</p></div></div>
    ${acts.length ? `<div class="moves">${verbs(acts).map((v, j) =>
      `<button class="${j === 0 ? 'main' : ''}" onclick="closeSheet();act(${v.a.i})">${esc(v.label)}</button>`).join('')}</div>` : ''}
    ${mats.length ? `<h4 style="margin-top:12px">Its materials — tap one to ${mats[0].kind === 'unselect' ? 'unchoose' : 'choose'} it</h4>
      <div class="grid">${mats.map(a => `<div class="pick" onclick="closeSheet();act(${a.i})" title="${esc(name(a.code))}"${bg(a.code)}></div>`).join('')}</div>` : ''}
    <button class="close" onclick="closeSheet()">Close</button>`;
  openSheet();
}
function openPile(pk) {
  // every pile can be looked through at any time, prompt or not; the cards a move can use
  // glow in place (user, 2026-11-25: "see into different piles ... even if there is an effect there")
  const [p, z] = pk.split('-'), pl = +p, mine = pl === S.you, P = S.board.players[pl];
  const loc = {d: 1, g: 16, b: 32, x: 64}[z];
  const acts = PILES[pk] || [];
  let list, ordered = true, note = '';
  if (z === 'd') {
    list = mine ? S.my_deck || [] : []; ordered = false;
    note = mine ? 'Sorted by card — the order stays hidden, as at a real table.' : `${P.deck_count} face-down cards. You cannot look at the AI's Deck.`;
  } else if (z === 'x') {
    list = mine ? S.my_extra || [] : P.extra_faceup || []; ordered = mine;
    if (!mine) note = `${P.extra_count - list.length} face-down, ${list.length} face-up.`;
  } else list = {g: P.grave, b: P.banished}[z] || [];
  // in its real order a card keeps its key, so a move on it glows on it; GY / banished top first
  let cells = list.map((c, i) => ({code: c, k: ordered ? key(pl, loc, i) : null}));
  if (z === 'g' || z === 'b') cells = cells.reverse();
  const on = new Set(cells.filter(c => c.k && BY[c.k]).map(c => c.k));
  const choose = acts.map(a => ({code: a.code, k: key(a.at.con, a.at.loc, a.at.seq)})).filter(c => !on.has(c.k));
  const cell = c => `<div class="${c.k && BY[c.k] ? (isPick() ? 'pick' : 'glow') : ''}" data-k="${c.k && BY[c.k] ? c.k : ''}"
      data-code="${c.code || ''}" title="${c.code ? esc(name(c.code)) : ''}"${bg(c.code)}></div>`;
  openSheet(`<h4>${mine ? 'Your' : "The AI's"} ${PILE[z]} (${z === 'd' ? P.deck_count : z === 'x' ? P.extra_count : list.length})</h4>
    ${acts.length ? '<p>Glowing cards can be used or chosen — tap one. Tap any card to read it.</p>' : '<p>Tap a card to read it.</p>'}
    ${choose.length ? `<div class="grid">${choose.map(cell).join('')}</div>` : ''}
    ${cells.length ? `<div class="grid">${cells.map(cell).join('')}</div>` : choose.length ? '' : '<p class="note">empty</p>'}
    ${note ? `<p class="note">${esc(note)}</p>` : ''}
    <button class="close" onclick="closeSheet()">Close</button>`);
  document.querySelectorAll('#sheet-in .grid div').forEach(el => el.onclick = () => {
    const k = el.dataset.k; closeSheet(); openCard(el.dataset.code, k || null); });
}
function openSheet(html) {
  const box = document.getElementById('sheet-in');
  if (html !== undefined) box.innerHTML = html;
  document.getElementById('sheet').classList.add('on');
  box.scrollTop = 0;
  paint(box);
}
function wire() {
  document.querySelectorAll('.mat [data-k]').forEach(el => {
    if (el.dataset.zone) { el.onclick = () => act(ZONE[el.dataset.k].i); return; }
    if (el.classList.contains('cell')) return;
    el.onclick = e => { e.stopPropagation(); openCard(el.dataset.code, el.dataset.k); };
  });
  document.querySelectorAll('.mat [data-pile]').forEach(el => el.onclick = () => openPile(el.dataset.pile));
}
async function flagIt() {
  const note = prompt('What did the AI (or the game) do unoptimally here?');
  if (note === null) return;
  const r = await fetch(`{{ url_for('views.flag_add') }}`, {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({kind: 'duel', page: location.pathname, step: S.moves, note})});
  const j = await r.json();
  alert(j.error ? j.error : `Flagged (${j.open} open) — see the flags page.`);
}
async function undo() {
  document.getElementById('undo').disabled = true;
  const r = await fetch(`{{ url_for('views.duel_undo', did=state.id) }}`, {method: 'POST', credentials: 'same-origin'});
  const j = await r.json();
  if (j.error) { alert(j.error); } else S = j;
  render();
}
function pickCards() {      // Cards mode: tick the cards the duel should stop for
  const want = new Set(S.respond_cards || []);
  const box = document.getElementById('sheet-in');
  box.innerHTML = `<h4>Stop to respond only for these cards</h4>
    <p>Tap to tick or untick (<b id="pick-n">${want.size}</b> selected). The duel passes every other
      chance to respond for you.</p>
    <div class="grid">${(S.respond_choices || []).map(c => `<div class="${want.has(c.code) ? 'on' : 'off'}" data-code="${c.code}"${bg(c.code)}><span>${esc(c.name)}</span></div>`).join('')}</div>
    <div class="moves"><button class="main" id="pick-save">Save</button></div>
    <button class="close" onclick="closeSheet()">Cancel</button>`;
  box.querySelectorAll('.grid div').forEach(el => el.onclick = () => {
    const c = +el.dataset.code;
    if (want.has(c)) want.delete(c); else want.add(c);
    el.className = want.has(c) ? 'on' : 'off';
    document.getElementById('pick-n').textContent = want.size; });
  document.getElementById('pick-save').onclick = () => { closeSheet(); setMode('select', [...want], true); };
  openSheet();
}
async function setMode(m, cards, force) {
  if (m === 'select' && cards === undefined) return pickCards();
  if (m === (S.respond || 'auto') && !force) return;
  const body = 'mode=' + m + (cards !== undefined ? '&cards=' + cards.join(',') : '');
  const r = await fetch(`{{ url_for('views.duel_respond', did=state.id) }}`, {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body});
  const j = await r.json();
  if (j.error) { alert(j.error); } else S = j;
  render();
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }
async function act(i) {
  document.getElementById('bar').innerHTML = '';
  document.getElementById('banner').innerHTML = '…';
  try {
    const r = await fetch(`{{ url_for('views.duel_act', did=state.id) }}`, {method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'i=' + i});
    const j = await r.json();
    if (j.error) { alert(j.error); } else S = j;
  } catch (e) {     // the connection dropped: show where the duel really is
    try { const r = await fetch(`{{ url_for('views.duel_state', did=state.id) }}`, {credentials: 'same-origin'});
          if (r.ok) S = await r.json(); } catch (e2) { alert('Lost the connection — reload the page.'); }
  }
  render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// everything either deck can show, fetched in the background so a tap never waits
[...new Set([...Object.keys(S.names), ...(S.respond_choices || []).map(c => c.code)])].forEach(c => load(c));
setInterval(async () => {
  if (S.status !== 'thinking') return;
  const r = await fetch(`{{ url_for('views.duel_state', did=state.id) }}`, {credentials: 'same-origin'});
  if (r.ok) { S = await r.json(); render(); }
}, 2000);
render();
