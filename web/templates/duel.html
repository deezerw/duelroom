{% extends "base.html" %}
{% block body %}
<style>
  /* A playmat, not a list (user, 2026-11-21: "it needs to feel like a regular game").
     The AI's side is mirrored above yours; every legal move lives ON the card or zone
     it uses -- glowing ones can act, a tap opens the card with its moves -- and only
     the moves with no card (phases, pass, done) are buttons. */
  .mat{--w:min(calc((100vw - 46px) / 7), 74px);--h:calc(var(--w) * 1.46);max-width:calc(var(--w) * 7 + 24px);
       margin:0 auto;user-select:none;-webkit-user-select:none}
  .hud{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 4px;border-bottom:1px solid var(--line)}
  .hud .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .phases{display:flex;gap:3px;align-items:center}
  .phases b{font-size:10.5px;font-weight:700;padding:2px 5px;border-radius:4px;color:var(--faint);border:1px solid var(--line)}
  .phases b.on{color:#111;background:#7aa2f7;border-color:#7aa2f7}
  .lps{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  .lps small{font-weight:400;color:var(--dim);font-size:11px}
  .lps .low{color:#f7768e}
  .banner{margin:6px 0 0;padding:7px 10px;border-radius:8px;background:var(--panel);font-size:13.5px;line-height:1.35}
  .banner.you{border-left:4px solid #9ece6a}
  .banner.wait{border-left:4px solid #e0af68}
  .banner .last{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .side{display:grid;grid-template-columns:repeat(7, var(--w));gap:3px;justify-content:center;margin:4px 0}
  .cell{width:var(--w);height:var(--h);border-radius:5px;border:1px dashed #ffffff18;position:relative;
        display:flex;align-items:center;justify-content:center}
  .cell.pile{border-style:solid;border-color:#ffffff10;background:#ffffff05}
  .cell .tag{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:var(--faint);
             pointer-events:none;text-shadow:0 0 3px #000}
  .cell .cnt{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:var(--ink);
             background:#000a;border-radius:4px;padding:0 3px;z-index:3}
  .c{width:var(--w);height:var(--h);border-radius:5px;background:#2a2f45 center/cover no-repeat;position:absolute;
     inset:0;margin:auto;box-shadow:0 1px 3px #0008}
  .c.back{background:repeating-linear-gradient(45deg,#3b2f5a,#3b2f5a 6px,#2c2346 6px,#2c2346 12px)}
  .c.def{transform:rotate(90deg) scale(.68)}
  .c .mat-n{position:absolute;top:-4px;left:-4px;background:#7aa2f7;color:#111;font-size:10px;font-weight:700;
            border-radius:999px;padding:0 4px;line-height:14px}
  .glow{outline:3px solid #9ece6a;outline-offset:1px;animation:pulse 1.4s ease-in-out infinite;cursor:pointer;z-index:2}
  .pick{outline:3px solid #e0af68;outline-offset:1px;animation:pulse 1.1s ease-in-out infinite;cursor:pointer;z-index:2}
  .cell.zonepick{border:2px solid #e0af68;background:#e0af6822;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
  @keyframes pulse{50%{outline-color:transparent;border-color:transparent}}
  .mid{display:grid;grid-template-columns:repeat(7, var(--w));gap:3px;justify-content:center;margin:2px 0;
       border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;padding:3px 0}
  .aihand{display:flex;justify-content:center;gap:2px;min-height:calc(var(--h) * .38);margin:6px 0 2px}
  .aihand i{width:calc(var(--w) * .5);height:calc(var(--h) * .38);border-radius:3px;
            background:repeating-linear-gradient(45deg,#3b2f5a,#3b2f5a 4px,#2c2346 4px,#2c2346 8px)}
  .hand{display:flex;justify-content:center;padding:12px 4px 6px;overflow-x:auto;min-height:calc(var(--h) * 1.25)}
  .hand .h{flex:0 0 auto;width:calc(var(--w) * 1.22);height:calc(var(--h) * 1.22);margin-left:calc(var(--w) * -.18);
           border-radius:6px;background:#2a2f45 center/cover no-repeat;position:relative;box-shadow:0 2px 6px #000a;
           transition:transform .12s}
  .hand .h:first-child{margin-left:0}
  .hand .h.glow,.hand .h.pick{transform:translateY(-8px)}
  .bar{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
       padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .bar button{min-height:44px;padding:0 16px;font-size:14.5px;font-weight:600;border-radius:10px}
  .bar button.main{background:#7aa2f7;color:#111;border-color:#7aa2f7}
  .bar:empty{display:none}
  details.log{margin:8px 0}
  details.log summary{cursor:pointer;font-weight:600;font-size:13px}
  #log{font-size:12.5px;line-height:1.45;color:var(--dim);margin-top:4px}
  .sheet{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .in{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(560px,100%);
             max-height:88vh;overflow-y:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .sheet .head{display:flex;gap:12px;align-items:flex-start}
  .sheet .head img{width:min(34vw,140px);border-radius:6px;flex:0 0 auto}
  .sheet h4{margin:0 0 6px;font-size:16px}
  .sheet p{white-space:pre-line;font-size:13px;line-height:1.42;margin:0;color:var(--dim)}
  .sheet .moves{display:grid;gap:8px;margin-top:12px}
  .sheet .moves button{min-height:48px;font-size:15px;font-weight:600;border-radius:10px;text-align:left;padding:0 14px}
  .sheet .moves button.main{background:#9ece6a;color:#111;border-color:#9ece6a}
  .sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
  .sheet .grid div{aspect-ratio:1/1.46;border-radius:5px;background:#2a2f45 center/cover no-repeat;position:relative}
  .sheet .close{margin-top:10px;width:100%;min-height:44px}
  .back{font-size:12px;margin-right:6px}
  /* a phone shows the table only: the site header gives way (a back link sits in the HUD) */
  @media (max-width:760px){.page-head{display:none} body > header{display:none} main{padding-top:0}}
  @media (min-width:761px){.back{display:none}}
</style>

<div class="page-head">
  <h1>Duel #{{ state.id }}</h1>
  <div class="sub">{{ state.user_deck }} (you) vs {{ state.ai_deck }} (AI) ·
    <a href="{{ url_for('views.duel_list') }}">all duels</a></div>
</div>

<div class="mat">
  <div class="hud">
    <div class="top"><div class="phases"><a class="back" href="{{ url_for('views.duel_list') }}">← duels</a><span class="phases" id="phases"></span></div>
      <div class="lps" id="lps"></div></div>
    <div class="banner" id="banner"></div>
  </div>
  <div class="aihand" id="aihand"></div>
  <div class="side" id="ai-st"></div>
  <div class="side" id="ai-m"></div>
  <div class="mid" id="emz"></div>
  <div class="side" id="you-m"></div>
  <div class="side" id="you-st"></div>
  <div class="hand" id="hand"></div>
  <div class="bar" id="bar"></div>
  <details class="log"><summary>What happened · <a href="{{ url_for('views.duel_list') }}">all duels</a></summary>
    <div id="log"></div></details>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheet-in"></div></div>

<script>
let S = {{ state|tojson }};
const base = `{{ url_for('views.index') }}img`;
const img = (c, size) => `${base}/${size || 'small'}/${c}.jpg`;
const name = c => (S.names[String(c)] || ('#' + c));
const text = c => (S.texts && S.texts[String(c)]) || '';
const esc = t => String(t).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const Z = {1: 'd', 2: 'h', 4: 'm', 8: 's', 16: 'g', 32: 'b', 64: 'x', 128: 'o'};
const key = (con, loc, seq) => `${con}-${Z[loc] || loc}-${seq}`;
const PILE = {g: 'GY', b: 'Banished', x: 'Extra Deck', d: 'Deck', o: 'Materials'};
let BY = {}, ZONE = {}, FREE = [], PILES = {};

function index() {
  BY = {}; ZONE = {}; FREE = []; PILES = {};
  for (const a of S.actions || []) {
    if (a.zone) { ZONE[key(a.zone.con, a.zone.loc, a.zone.seq)] = a; continue; }
    // yes / no / an effect choice are questions, not card moves: buttons, with the card named
    if (a.at && !['position', 'yes', 'no', 'option'].includes(a.kind)) {
      const k = key(a.at.con, a.at.loc, a.at.seq), z = Z[a.at.loc];
      (BY[k] = BY[k] || []).push(a);
      if (PILE[z]) { const pk = `${a.at.con}-${z}`; (PILES[pk] = PILES[pk] || []).push(a); }
      continue;
    }
    FREE.push(a);
  }
}
const isPick = () => /SELECT_(CARD|UNSELECT_CARD|TRIBUTE|SUM)$/.test(S.prompt || '');
function cls(k) { return BY[k] ? (isPick() ? ' pick' : ' glow') : ''; }

function cardEl(code, pos, k, mats) {
  const back = code === null || code === undefined;
  const def = pos && (pos & 0xC);
  const n = mats && mats.length ? `<b class="mat-n">${mats.length}</b>` : '';
  return `<div class="c${back ? ' back' : ''}${def ? ' def' : ''}${cls(k)}" data-k="${k}" data-code="${back ? '' : code}"
    style="${back ? '' : `background-image:url(${img(code)})`}">${n}</div>`;
}
function zoneCell(p, loc, seq, list, label) {
  const k = key(p, loc, seq);
  const m = (list || []).find(x => x && x.sequence === seq);
  const zp = ZONE[k] ? ' zonepick' : '';
  return `<div class="cell${zp}" data-k="${k}" data-zone="${ZONE[k] ? 1 : ''}">${m ? cardEl(m.code, m.position, k, m.overlay) : ''}
    ${!m && label ? `<span class="tag">${label}</span>` : ''}</div>`;
}
function pileCell(p, z, cards, count) {
  const pk = `${p}-${z}`, top = cards && cards.length ? cards[cards.length - 1] : null;
  const n = count !== undefined ? count : (cards || []).length;
  const g = PILES[pk] ? (isPick() ? ' pick' : ' glow') : '';
  return `<div class="cell pile${g}" data-pile="${pk}">${top ? `<div class="c" style="background-image:url(${img(top)})"></div>`
    : (z === 'd' || z === 'x') && n ? '<div class="c back"></div>' : ''}<span class="cnt">${n}</span><span class="tag">${PILE[z]}</span></div>`;
}
function row(p, loc, mirror, left, right) {
  const P = S.board.players[p], list = loc === 4 ? P.mzone : P.szone;
  let seqs = [0, 1, 2, 3, 4]; if (mirror) seqs = seqs.reverse();
  return left + seqs.map(s => zoneCell(p, loc, s, list)).join('') + right;
}
function render() {
  index();
  const you = S.you, ai = S.ai, PY = S.board.players[you], PA = S.board.players[ai];
  const ph = {1: 'DP', 2: 'SP', 4: 'M1', 8: 'BP', 16: 'BP', 32: 'BP', 64: 'BP', 128: 'BP', 256: 'M2', 512: 'EP'}[S.phase];
  document.getElementById('phases').innerHTML = ['DP', 'SP', 'M1', 'BP', 'M2', 'EP'].map(x =>
    `<b class="${x === ph ? 'on' : ''}">${x}</b>`).join('') +
    `<span style="font-size:11px;color:var(--dim);margin-left:4px">T${S.turn} ${S.turn_player === you ? 'you' : 'AI'}</span>`;
  const lp = (who, v) => `<span><small>${who}</small> <span class="${v <= 2000 ? 'low' : ''}">${v}</span></span>`;
  document.getElementById('lps').innerHTML = lp('AI', PA.lp) + lp('you', PY.lp);
  // the board: the AI mirrored on top, you below
  document.getElementById('aihand').innerHTML = '<i></i>'.repeat((PA.hand || []).length);
  document.getElementById('ai-st').innerHTML = row(ai, 8, true, pileCell(ai, 'd', null, PA.deck_count),
                                                    pileCell(ai, 'x', PA.extra_faceup, PA.extra_count));
  document.getElementById('ai-m').innerHTML = row(ai, 4, true, pileCell(ai, 'g', PA.grave), zoneCell(ai, 8, 5, PA.szone, 'field'));
  // extra monster zones (sequence 5 / 6), whoever holds them; banished piles at the ends
  const emz = s => { const own = [you, ai].find(p => (S.board.players[p].mzone || []).some(m => m && m.sequence === s));
    return own === undefined ? zoneCell(you, 4, s, [], 'EMZ') : zoneCell(own, 4, s, S.board.players[own].mzone); };
  document.getElementById('emz').innerHTML = pileCell(ai, 'b', PA.banished) + '<div></div>' + emz(5) + '<div></div>'
                                             + emz(6) + '<div></div>' + pileCell(you, 'b', PY.banished);
  document.getElementById('you-m').innerHTML = row(you, 4, false, zoneCell(you, 8, 5, PY.szone, 'field'), pileCell(you, 'g', PY.grave));
  document.getElementById('you-st').innerHTML = row(you, 8, false, pileCell(you, 'x', PY.extra_faceup, PY.extra_count),
                                                     pileCell(you, 'd', null, PY.deck_count));
  document.getElementById('hand').innerHTML = (PY.hand || []).map((c, i) => {
    const k = key(you, 2, i);
    return `<div class="h${cls(k)}" data-k="${k}" data-code="${c}" style="background-image:url(${img(c)})"></div>`; }).join('');
  banner();
  bar();
  document.getElementById('log').innerHTML = (S.log || []).slice().reverse().map(x =>
    `T${x.turn} ${x.who ? '<b>' + esc(x.who) + '</b> ' : ''}${esc(x.text)}`).join('<br>');
  wire();
}
function banner() {
  const b = document.getElementById('banner');
  const top = S.chain.length ? S.chain[S.chain.length - 1] : null;
  const last = (S.log || []).slice(-1)[0];
  const chainTxt = S.chain.length ? `<span class="last"><b>Chain</b>: ${S.chain.map(([c, p]) =>
    `${p === S.you ? 'you' : 'AI'} ${esc(name(c))}`).join(' → ')}</span>` : '';
  const lastTxt = chainTxt + (last ? `<span class="last">${last.who ? esc(last.who) + ': ' : ''}${esc(last.text)}</span>` : '');
  if (S.status === 'thinking') { b.className = 'banner wait'; b.innerHTML = 'The AI is thinking…' + lastTxt; return; }
  if (S.status === 'over') { b.className = 'banner wait'; b.innerHTML = esc(S.note || 'The duel is over.'); return; }
  if (!(S.actions || []).length) { b.className = 'banner wait'; b.innerHTML = 'Waiting for the AI…' + lastTxt; return; }
  const glowing = Object.keys(BY).length || Object.keys(ZONE).length;
  const by = top ? `${top[1] === S.you ? 'your' : "the AI's"} <b>${esc(name(top[0]))}</b>` : '';
  let t;
  switch (S.prompt) {
    case 'MSG_SELECT_IDLECMD': t = 'Your Main Phase — tap a glowing card to use it' + (FREE.length ? ', or pick a phase below.' : '.'); break;
    case 'MSG_SELECT_BATTLECMD': t = 'Battle Phase — tap a glowing monster to attack, or move on below.'; break;
    case 'MSG_SELECT_CHAIN': t = top ? `${top[1] === S.you ? 'You' : 'The AI'} activated <b>${esc(name(top[0]))}</b>. `
        + (glowing ? 'Respond with a glowing card, or pass.' : 'Nothing to respond with — pass.')
        : (glowing ? 'You can respond now with a glowing card, or pass.' : 'Pass to go on.'); break;
    case 'MSG_SELECT_PLACE': t = 'Choose a zone — tap a highlighted zone.'; break;
    case 'MSG_SELECT_POSITION': t = 'Choose the position.'; break;
    case 'MSG_SELECT_EFFECTYN': case 'MSG_SELECT_YESNO': {
      const q = FREE.find(a => a.code);
      t = q ? `Use <b>${esc(name(q.code))}</b>'s effect?` : 'Use the effect?'; break; }
    case 'MSG_SELECT_OPTION': t = 'Choose an effect.'; break;
    default:
      // which chain link asks is not known here: name none rather than the wrong one
      t = isPick() ? 'Choose a card — tap a highlighted card'
                     + (Object.keys(PILES).length ? ' or a highlighted pile' : '') + '.' : 'Your move.';
  }
  b.className = 'banner you'; b.innerHTML = t + lastTxt;
}
const FREE_ORDER = ['battle_phase', 'main2', 'end_phase', 'pass', 'finish', 'yes', 'no', 'cancel', 'option',
                    'position', 'number', 'declare', 'rps', 'shuffle'];
const SHORT = {battle_phase: 'Battle Phase', main2: 'Main Phase 2', end_phase: 'End turn', pass: 'Pass', finish: 'Done',
               yes: 'Yes', no: 'No', cancel: 'Cancel', shuffle: 'Shuffle hand'};
const POS = {1: 'Face-up Attack', 2: 'Face-down Attack', 4: 'Face-up Defense', 8: 'Set (face-down Defense)'};
function bar() {
  const acts = FREE.filter(a => a.kind !== 'shuffle')
                   .sort((a, b) => FREE_ORDER.indexOf(a.kind) - FREE_ORDER.indexOf(b.kind));
  const main = acts.length === 1 || ['yes', 'finish'].includes((acts[0] || {}).kind) ? 0 : -1;
  document.getElementById('bar').innerHTML = acts.map((a, j) =>
    `<button class="${j === main ? 'main' : ''}" onclick="act(${a.i})">${esc(a.kind === 'position' ? POS[a.pos] || a.label
      : SHORT[a.kind] || a.label)}</button>`).join('');
}
function verbs(acts) {      // the moves of one card, told apart when a card has several of a kind
  return acts.map((a, j) => {
    const many = acts.filter(x => x.verb === a.verb).length > 1;
    const n = acts.slice(0, j + 1).filter(x => x.verb === a.verb).length;
    return {a, label: a.kind === 'select' ? 'Choose this card' : a.kind === 'unselect' ? 'Unchoose' :
            a.kind === 'attack' ? 'Attack' : a.kind === 'chain' ? 'Activate (respond)' : a.verb + (many ? ` (effect ${n})` : '')};
  });
}
function openCard(code, k) {
  const acts = (k && BY[k]) || [];
  if (acts.length === 1 && ['select', 'unselect'].includes(acts[0].kind)) return act(acts[0].i);
  const known = code !== '' && code !== undefined && code !== null;
  document.getElementById('sheet-in').innerHTML = `<div class="head">${known ? `<img src="${img(code, 'full')}" alt="">` : ''}
    <div><h4>${known ? esc(name(code)) : 'Face-down card'}</h4><p>${known ? esc(text(code)) : ''}</p></div></div>
    ${acts.length ? `<div class="moves">${verbs(acts).map((v, j) =>
      `<button class="${j === 0 ? 'main' : ''}" onclick="closeSheet();act(${v.a.i})">${esc(v.label)}</button>`).join('')}</div>` : ''}
    <button class="close" onclick="closeSheet()">Close</button>`;
  document.getElementById('sheet').classList.add('on');
}
function openPile(pk) {
  const [p, z] = pk.split('-');
  const P = S.board.players[+p];
  const acts = PILES[pk] || [];
  const list = {g: P.grave, b: P.banished, x: P.extra_faceup}[z] || [];
  // a pile you choose from shows the cards you may choose; else what it holds
  const shown = acts.length ? acts.map(a => ({code: a.code, k: key(a.at.con, a.at.loc, a.at.seq)}))
                            : list.map(c => ({code: c, k: null}));
  document.getElementById('sheet-in').innerHTML = `<h4>${+p === S.you ? 'Your' : "The AI's"} ${PILE[z]} (${shown.length})</h4>
    ${acts.length ? '<p>Tap a card to use or choose it.</p>' : ''}
    <div class="grid">${shown.map(s => `<div class="${s.k ? (isPick() ? 'pick' : 'glow') : ''}" data-k="${s.k || ''}"
      data-code="${s.code || ''}" style="${s.code ? `background-image:url(${img(s.code)})` : ''}"></div>`).join('')
      || '<span class="muted">empty</span>'}</div>
    <button class="close" onclick="closeSheet()">Close</button>`;
  document.getElementById('sheet').classList.add('on');
  document.querySelectorAll('#sheet-in .grid div').forEach(el => el.onclick = () => {
    const k = el.dataset.k; closeSheet(); openCard(el.dataset.code, k || null); });
}
function wire() {
  document.querySelectorAll('.mat [data-k]').forEach(el => {
    if (el.dataset.zone) { el.onclick = () => act(ZONE[el.dataset.k].i); return; }
    if (el.classList.contains('cell')) return;
    el.onclick = e => { e.stopPropagation(); openCard(el.dataset.code, el.dataset.k); };
  });
  document.querySelectorAll('.mat [data-pile]').forEach(el => el.onclick = () => openPile(el.dataset.pile));
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }
async function act(i) {
  document.getElementById('bar').innerHTML = '';
  document.getElementById('banner').innerHTML = '…';
  const r = await fetch(`{{ url_for('views.duel_act', did=state.id) }}`, {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'i=' + i});
  const j = await r.json();
  if (j.error) { alert(j.error); } else S = j;
  render();
}
setInterval(async () => {
  if (S.status !== 'thinking') return;
  const r = await fetch(`{{ url_for('views.duel_state', did=state.id) }}`, {credentials: 'same-origin'});
  if (r.ok) { S = await r.json(); render(); }
}, 2000);
render();
</script>
{% endblock %}
