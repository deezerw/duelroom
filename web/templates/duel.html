{% extends "base.html" %}
{% block body %}
<style>
  /* Mobile first (user, 2026-11-21: "fix the duel ui for mobile"): the status and
     both LPs stay pinned at the top, your moves stay pinned at the bottom within
     thumb reach, the cards scale with the screen, a tap on any card reads it. */
  .duel{--cw:min(13.5vw,58px);--ch:calc(var(--cw)*1.46);display:grid;gap:8px;padding-bottom:4px}
  .hud{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
       padding:8px 2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
  .hud #status{font-weight:700}
  .lp{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .lp small{font-weight:400;color:var(--dim)}
  .lp.low{color:#f7768e}
  .side{border:1px solid var(--line);border-radius:10px;padding:8px}
  .side.turn{border-color:#7aa2f7aa}
  .side h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .zone{margin:4px 0 2px}
  .zone .lab{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
  .row.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .slot{flex:0 0 auto;width:var(--cw);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .slot.def{width:var(--ch)}
  .cardx{width:var(--cw);height:var(--ch);border-radius:4px;background:#2a2f45 center/cover no-repeat;position:relative}
  /* a rotated card keeps its upright box: pull the empty half-strips above and below back in */
  .slot.def .cardx{transform:rotate(90deg);margin:calc((var(--cw) - var(--ch)) / 2) 0}
  .cardx.back{background:repeating-linear-gradient(45deg,#3b2f5a,#3b2f5a 6px,#2c2346 6px,#2c2346 12px)}
  .cardx .mat{position:absolute;top:-5px;right:-5px;background:#7aa2f7;color:#111;font-size:10px;
              font-weight:700;border-radius:999px;padding:0 5px;line-height:15px}
  .cap{width:100%;font-size:9.5px;line-height:1.15;color:var(--dim);text-align:center;margin-top:3px;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
       max-height:2.3em}
  .slot.def .cap{width:var(--ch)}
  .empty{color:var(--faint);font-size:12px}
  .backs{display:flex;gap:3px;align-items:center}
  .backs i{width:calc(var(--cw)*.42);height:calc(var(--ch)*.42);border-radius:2px;
           background:repeating-linear-gradient(45deg,#3b2f5a,#3b2f5a 4px,#2c2346 4px,#2c2346 8px)}
  @media (max-width:760px){.page-head{margin:6px 0 2px}.page-head h1{font-size:20px;margin:0}
    .page-head .sub{font-size:12.5px}}
  .meta{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
  .meta b{color:var(--ink);font-weight:600}
  #chain{font-size:12.5px;border-left:3px solid #e0af68;padding:4px 8px;margin:0}
  #chain:empty{display:none}
  .acts{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
        padding:8px 0 calc(8px + env(safe-area-inset-bottom));max-height:42vh;overflow-y:auto}
  .acts .prompt{font-size:12px;color:var(--dim);margin:0 0 6px}
  .acts .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
  .acts button{display:flex;align-items:center;gap:8px;text-align:left;min-height:44px;width:100%;
               font-size:14px;padding:6px 10px;line-height:1.2}
  .acts button i{flex:0 0 auto;width:26px;height:38px;border-radius:3px;background:#2a2f45 center/cover no-repeat}
  .acts button.pass{opacity:.85}
  details.log summary{cursor:pointer;font-weight:600;padding:4px 0}
  #log{font-size:12.5px;margin-top:4px;line-height:1.45}
  /* tap-to-read sheet */
  .sheet{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .in{background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(560px,100%);
             max-height:85vh;overflow-y:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .sheet .in img{width:min(62vw,260px);display:block;margin:0 auto 10px;border-radius:6px}
  .sheet h4{margin:0 0 6px;font-size:16px}
  .sheet p{white-space:pre-line;font-size:13.5px;line-height:1.45;margin:0}
  @media (min-width:761px){
    .acts{position:static;max-height:none;border:1px solid var(--line);border-radius:10px;padding:10px}
    .duel{--cw:60px}
  }
</style>

<div class="page-head">
  <h1>Duel #{{ state.id }}</h1>
  <div class="sub">{{ state.user_deck }} (you) vs {{ state.ai_deck }} (AI) ·
    <a href="{{ url_for('views.duel_list') }}">all duels</a></div>
</div>

<div class="duel">
  <div class="hud">
    <span id="status"></span>
    <span class="lp" id="lp-ai"></span>
    <span class="lp" id="lp-you"></span>
    <span id="note" class="muted" style="font-size:12.5px;flex-basis:100%"></span>
  </div>
  <div class="side" id="ai"></div>
  <div id="chain" class="muted"></div>
  <div class="side" id="you"></div>
  <div class="acts" id="acts"></div>
  <details class="log"><summary>What happened</summary><div id="log" class="muted"></div></details>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="in"><img id="sh-img" alt=""><h4 id="sh-name"></h4><p id="sh-text"></p>
    <button style="margin-top:12px;width:100%;min-height:44px" onclick="closeSheet()">Close</button></div>
</div>

<script>
let S = {{ state|tojson }};
const base = `{{ url_for('views.index') }}img`;
const img = (c, size) => `${base}/${size || 'small'}/${c}.jpg`;
const name = c => (S.names[String(c)] || c);
const esc = t => String(t).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
function card(c, pos, mats) {
  const back = c === null || c === undefined;
  const def = pos && (pos & 0xC);
  const n = mats && mats.length ? `<b class="mat" title="materials">${mats.length}</b>` : '';
  return `<div class="slot ${def ? 'def' : ''}" ${back ? '' : `onclick="openSheet(${c})"`}>
    <div class="cardx ${back ? 'back' : ''}" style="${back ? '' : `background-image:url(${img(c)})`}">${n}</div>
    <div class="cap">${back ? 'face-down' : esc(name(c))}</div></div>`;
}
function side(p, who) {
  const P = S.board.players[p];
  const zone = (lab, list, scroll) =>
    `<div class="zone"><div class="lab">${lab}</div><div class="row ${scroll ? 'scroll' : ''}">${list || '<span class="empty">empty</span>'}</div></div>`;
  const field = (P.mzone || []).map(m => card(m.code, m.position, m.overlay)).join('');
  const st = (P.szone || []).map(m => card(m.code, m.position)).join('');
  const n = (P.hand || []).length;
  // the AI's hand is only ever backs: small ones, no reading space wasted
  const hand = p === S.ai ? (n ? `<div class="backs">${'<i></i>'.repeat(n)}</div>` : '')
                          : (P.hand || []).map(c => card(c)).join('');
  const fieldz = field || st ? `${zone('monsters', field, true)}${zone('spell / trap', st, true)}`
                             : `<div class="zone"><span class="empty">field empty</span></div>`;
  const gy = (P.grave || []);
  const gyl = gy.length ? gy.map(c => `<a href="#" onclick="openSheet(${c});return false">${esc(name(c))}</a>`).join(', ') : '—';
  return `<h3><span>${esc(who)}</span><span class="lp">LP ${P.lp}</span></h3>
    ${fieldz}${zone(`hand (${n})`, hand)}
    <div class="meta"><b>GY ${gy.length}</b>: ${gyl}<br>banished ${(P.banished || []).length} · deck ${P.deck_count} · extra ${P.extra_count}</div>`;
}
const PROMPT = {MSG_SELECT_CHAIN: 'Respond?', MSG_SELECT_IDLECMD: 'Your main phase', MSG_SELECT_BATTLECMD: 'Battle phase',
  MSG_SELECT_CARD: 'Choose a card', MSG_SELECT_UNSELECT_CARD: 'Choose cards', MSG_SELECT_EFFECTYN: 'Use the effect?',
  MSG_SELECT_YESNO: 'Yes or no?', MSG_SELECT_POSITION: 'Choose a position', MSG_SELECT_PLACE: 'Choose a zone',
  MSG_SELECT_OPTION: 'Choose an option', MSG_SELECT_TRIBUTE: 'Choose tributes', MSG_SELECT_SUM: 'Choose cards (sum)'};
function render() {
  const yourTurn = S.turn_player === S.you;
  document.getElementById('ai').innerHTML = side(S.ai, 'AI · ' + S.ai_deck);
  document.getElementById('you').innerHTML = side(S.you, 'you · ' + S.user_deck);
  document.getElementById('ai').classList.toggle('turn', !yourTurn);
  document.getElementById('you').classList.toggle('turn', yourTurn);
  const st = {"your move": "Your move", "thinking": "AI is thinking…", "over": "Duel over"}[S.status] || S.status;
  document.getElementById('status').textContent = `${st} · T${S.turn} ${yourTurn ? '(yours)' : "(AI's)"}`;
  const lp = (id, who, p) => { const v = S.board.players[p].lp, e = document.getElementById(id);
    e.innerHTML = `<small>${who}</small> ${v}`; e.classList.toggle('low', v <= 2000); };
  lp('lp-ai', 'AI', S.ai); lp('lp-you', 'you', S.you);
  document.getElementById('note').textContent = S.note || '';
  document.getElementById('chain').innerHTML = S.chain.length ? '<b>Chain</b>: ' + S.chain.map(([c, p]) =>
    `${p === S.you ? 'you' : 'AI'}: <a href="#" onclick="openSheet(${c});return false">${esc(name(c))}</a>`).join(' → ') : '';
  document.getElementById('log').innerHTML = (S.log || []).map(x =>
    `T${x.turn} ${x.who ? '<b>' + esc(x.who) + '</b> ' : ''}${esc(x.text)}`).join('<br>');
  const acts = S.actions || [];
  const box = document.getElementById('acts');
  if (acts.length) {
    box.innerHTML = `<div class="prompt">${PROMPT[S.prompt] || 'Your move'}</div><div class="list">` + acts.map(a =>
      `<button class="${/^Pass|^Cancel|^No\b/.test(a.label) ? 'pass' : ''}" onclick="act(${a.i})">` +
      `${a.code ? `<i style="background-image:url(${img(a.code)})"></i>` : ''}<span>${esc(a.label)}</span></button>`).join('') + '</div>';
  } else {
    box.innerHTML = `<div class="prompt">${S.status === 'over' ? 'The duel is over.' : 'Waiting for the AI…'}</div>`;
  }
}
function openSheet(c) {
  document.getElementById('sh-img').src = img(c, 'full');
  document.getElementById('sh-name').textContent = name(c);
  document.getElementById('sh-text').textContent = (S.texts && S.texts[String(c)]) || '';
  document.getElementById('sheet').classList.add('on');
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }
async function act(i) {
  document.getElementById('acts').innerHTML = '<div class="prompt">…</div>';
  const r = await fetch(`{{ url_for('views.duel_act', did=state.id) }}`, {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'i=' + i});
  const j = await r.json();
  if (j.error) { alert(j.error); }
  else S = j;
  render();
}
setInterval(async () => {
  if (S.status !== 'thinking') return;
  const r = await fetch(`{{ url_for('views.duel_state', did=state.id) }}`, {credentials: 'same-origin'});
  if (r.ok) { S = await r.json(); render(); }
}, 2000);
render();
</script>
{% endblock %}
